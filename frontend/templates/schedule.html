{% extends "base.html" %}

{% block title %}Schedule - Social Media Automation{% endblock %}

{% block content %}
<div class="row mb-4">
    <div class="col-md-12">
        <h1 class="mb-1"><i class="fas fa-calendar"></i> Schedule Management</h1>
        <p class="text-muted">View and manage your scheduled posts</p>
    </div>
</div>

<!-- Scheduled Posts -->
<div class="row">
    <div class="col-md-12">
        <div class="card">
            <div class="card-header bg-light">
                <h5 class="mb-0">
                    <i class="fas fa-clock"></i> Scheduled Posts
                    <span class="badge bg-primary float-end" id="scheduled-count">0</span>
                </h5>
            </div>
            <div class="card-body">
                <div id="scheduled-list" class="list-group">
                    <p class="text-muted text-center py-4">Loading scheduled posts...</p>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Calendar View (placeholder) -->
<div class="row mt-4">
    <div class="col-md-12">
        <div class="card">
            <div class="card-header bg-light">
                <h5 class="mb-0"><i class="fas fa-calendar-alt"></i> Calendar View</h5>
            </div>
            <div class="card-body">
                <div class="alert alert-info">
                    <i class="fas fa-info-circle"></i>
                    Calendar view coming in Phase 2
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', loadScheduledPosts);

function loadScheduledPosts() {
    fetch('/api/scheduler/jobs')
        .then(r => r.json())
        .then(data => {
            document.getElementById('scheduled-count').textContent = data.count;

            const list = document.getElementById('scheduled-list');
            if (data.count === 0) {
                list.innerHTML = '<p class="text-muted text-center py-4">No scheduled posts</p>';
                return;
            }

            list.innerHTML = data.jobs.map(job => `
                <div class="list-group-item">
                    <div class="d-flex justify-content-between align-items-start">
                        <div class="flex-grow-1">
                            <h6 class="mb-1">Post #${job.id}</h6>
                            <p class="text-muted mb-1 small">${job.caption ? job.caption : 'No caption'}</p>
                            <p class="text-muted small mb-0">
                                📅 Scheduled: <strong>${new Date(job.scheduled_time).toLocaleString()}</strong><br>
                                📱 Platform: <span class="badge bg-info">${job.platform}</span>
                            </p>
                        </div>
                        <div class="btn-group" role="group">
                            <button class="btn btn-sm btn-warning" onclick="editPost(${job.id})">
                                <i class="fas fa-edit"></i> Edit
                            </button>
                            <button class="btn btn-sm btn-danger" onclick="cancelPost(${job.id})">
                                <i class="fas fa-times"></i> Cancel
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        })
        .catch(err => console.error('Error:', err));
}

function editPost(postId) {
    alert('Edit functionality coming soon');
}

function cancelPost(postId) {
    if (!confirm('Cancel this scheduled post?')) return;

    fetch(`/api/posts/${postId}`, { method: 'DELETE' })
        .then(r => r.json())
        .then(data => {
            if (data.success) {
                showNotification('Post cancelled', 'success');
                loadScheduledPosts();
            }
        })
        .catch(err => {
            showNotification('Error cancelling post', 'danger');
            console.error('Error:', err);
        });
}
</script>
{% endblock %}

version: '3.9'

# Lean production compose: backend only. SQLite on the mounted ./data volume,
# no Postgres/Redis containers, no nginx — the backend listens directly on
# :80 inside the container is avoided (stays :5000); host port 80 is mapped
# straight to it since there's no TLS cert (no custom domain yet).
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: aphelion-backend
    env_file:
      - .env.production
    ports:
      - "80:5000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

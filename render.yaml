# Render deployment: ONE service serving both the API and the built SPA.
#
# Docker rather than Render's native Python runtime because:
#   * building the SPA needs Node, which the Python runtime does not guarantee
#   * ffmpeg/ffprobe can be installed, so thumbnails and duration validation
#     work in production instead of silently degrading
#
# One service rather than separate frontend/backend because:
#   * same origin, so CORS does not apply to the SPA at all
#   * one custom domain and one reputation to establish - relevant while
#     *.onrender.com is flagged by Google Safe Browsing
#   * one free instance instead of two
#
# Free-tier limitations still in force:
#   * the service sleeps after ~15 minutes idle, so APScheduler jobs do NOT
#     fire reliably. Scheduling needs a paid instance or an external pinger.
#   * uploaded videos live on an ephemeral disk and are lost on restart. The
#     database is external (Supabase) and is NOT affected.

services:
  - type: web
    name: social-media-manager-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /health

    envVars:
      # ---- secrets: set in the dashboard, never in git ----
      - key: DATABASE_URL          # Supabase pooled connection string
        sync: false
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      - key: LINKEDIN_REDIRECT_URI
        sync: false
      - key: API_ACCESS_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
      # LinkedIn `sub` values allowed to hold the admin role. When set, the
      # "first account becomes admin" bootstrap is disabled entirely.
      - key: ADMIN_LINKEDIN_SUBS
        sync: false

      # The SPA is served from this same origin now, so both point at the
      # service's own URL.
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false

      - key: LINKEDIN_API_VERSION
        value: "202607"
      - key: ALLOW_NEW_SIGNUPS
        value: "true"
      - key: FLASK_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: TIMEZONE
        value: Asia/Kolkata

      # Instagram is scaffolded and disabled; these satisfy config validation
      # without implying a working integration.
      - key: INSTAGRAM_USERNAME
        value: your_instagram_username
      - key: INSTAGRAM_PASSWORD
        value: your_instagram_password
      - key: CLAUDE_API_KEY
        value: sk-ant-placeholder-not-used-in-v1

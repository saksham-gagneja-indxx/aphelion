services:
  - type: web
    name: postpilot-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 4 -b 0.0.0.0:5000 "backend.app:create_app()"

    env:
      - key: FLASK_ENV
        value: production
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PORT
        value: "5000"

    envVars:
      - key: SECRET_KEY
        sync: false
      - key: API_ACCESS_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: LINKEDIN_API_KEY
        sync: false
      - key: LINKEDIN_ACCESS_TOKEN
        sync: false
      - key: CORS_ORIGINS
        value: https://postpilot.vercel.app

    healthCheckPath: /health
    healthCheckInterval: 30
    plan: free

services:
  - type: web
    name: postpilot-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 4 -b 0.0.0.0:5000 "backend.app:create_app()"

    env:
      - key: FLASK_ENV
        value: production
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PORT
        value: "5000"

    envVars:
      - key: SECRET_KEY
        sync: false  # Set manually in Render dashboard
      - key: API_ACCESS_KEY
        sync: false
      - key: DATABASE_URL
        sync: false  # From Supabase
      - key: REDIS_URL
        sync: false  # From Upstash
      - key: CLERK_SECRET_KEY
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://postpilot.vercel.app

    healthCheckPath: /health
    healthCheckInterval: 30
    maxInstanceCount: 1
    plan: free

databases:
  - name: postpilot-db
    databaseName: postpilot
    user: postgres
    plan: free  # Note: Use Supabase instead for free PostgreSQL

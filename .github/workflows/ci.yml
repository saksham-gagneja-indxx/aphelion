name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets a branch be checked before it is merged, which matters while more
  # than one machine is pushing to this repository.
  workflow_dispatch:

concurrency:
  # A newer push makes an in-flight run for the same ref pointless.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        # The suite builds its own throwaway SQLite database per test, so the
        # only settings needed are the ones validate_settings() insists on.
        env:
          API_ACCESS_KEY: ci-test-key
          SECRET_KEY: ci-secret-not-a-real-key
          CLAUDE_API_KEY: sk-ant-placeholder-not-used-in-ci
          INSTAGRAM_USERNAME: your_instagram_username
          INSTAGRAM_PASSWORD: your_instagram_password
          CORS_ORIGINS: http://localhost:5173
        run: python -m pytest tests/ -q

  frontend:
    name: Frontend (typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

  secrets:
    name: No committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure .env is not tracked
        # This repository's .env holds live LinkedIn and database credentials.
        # Committing it is the single most expensive mistake available here, so
        # it is checked rather than trusted to .gitignore staying correct.
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env is tracked by git. Remove it and rotate every credential in it."
            exit 1
          fi
          echo "OK: .env is not tracked"

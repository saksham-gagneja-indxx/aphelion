name: CI - Linting & Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-lint:
    name: Backend - Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pylint mypy

      - name: Lint with flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 backend --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Type check with mypy
        run: mypy backend --ignore-missing-imports || true

  frontend-lint:
    name: Frontend - Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Lint with ESLint
        run: cd frontend && npm run lint || true

      - name: Type check
        run: cd frontend && npm run type-check || true

  backend-test:
    name: Backend - Unit Tests
    runs-on: ubuntu-latest
    # No service container needed: DATABASE_URL below is a plain file-based
    # SQLite path, not a server - there's no "sqlite" server image because
    # SQLite doesn't have a server to run. (There used to be a `services:
    # sqlite: image: sqlite:latest` block here; no such image exists, so it
    # failed this job on every run before pytest ever started.)
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio

      - name: Run tests
        run: |
          pytest tests -v --cov=backend --cov-report=xml --cov-report=term-missing
        env:
          DATABASE_URL: sqlite:///test.db
          API_ACCESS_KEY: test_key
          SECRET_KEY: test_secret
          CLERK_SECRET_KEY: test_clerk_key
          ENCRYPTION_KEY: ucWu8K-SJZDKTDAujfaFxAqvQOl5MEFyDmoc94mHELg=
          # Required (non-Optional) Settings fields, same placeholder
          # convention as .env.example - the app itself treats these as
          # "not configured" via is_placeholder(), not as an error, but
          # pydantic still requires *something* to be present.
          INSTAGRAM_USERNAME: your_instagram_username
          INSTAGRAM_PASSWORD: your_instagram_password

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: backend
          fail_ci_if_error: false

  frontend-test:
    name: Frontend - Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Run tests
        run: cd frontend && npm run test -- --coverage || true

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./frontend/coverage/coverage-final.json
          flags: frontend
          fail_ci_if_error: false

  security-scan:
    name: Security - Scan Dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # required to upload SARIF to the Security tab
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

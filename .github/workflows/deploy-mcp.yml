name: Deploy MCP to Cloudflare Workers

on:
  push:
    branches:
      - feat/mcp-deployment
      - main
    paths:
      - 'mcp-server/**'
      - '.github/workflows/deploy-mcp.yml'
  pull_request:
    branches:
      - feat/mcp-deployment
      - main
    paths:
      - 'mcp-server/**'

jobs:
  test:
    name: Test MCP Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'mcp-server/package-lock.json'

      - name: Install dependencies
        working-directory: mcp-server
        run: npm install

      - name: Type check
        working-directory: mcp-server
        run: npx tsc --noEmit

      - name: Lint (if applicable)
        working-directory: mcp-server
        run: npm run lint --if-present

      - name: Run tests (if applicable)
        working-directory: mcp-server
        run: npm test --if-present

  deploy:
    name: Deploy to Cloudflare Workers
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/feat/mcp-deployment' || github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'mcp-server/package-lock.json'

      - name: Install dependencies
        working-directory: mcp-server
        run: npm install

      - name: Deploy to Cloudflare Workers
        working-directory: mcp-server
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ MCP deployment test passed!\n\nOnce merged to `feat/mcp-deployment`, the MCP will auto-deploy to Cloudflare Workers.'
            })

      - name: Notify Slack (optional)
        if: success()
        uses: slackapi/slack-github-action@v1
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": "✅ MCP deployed to Cloudflare Workers",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*MCP Deployment Successful*\n\nBranch: `${{ github.ref }}`\nCommit: `${{ github.sha }}`\nURL: https://post-pilot.reel-automation-mcp.workers.dev"
                  }
                }
              ]
            }

  build-docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Verify docs exist
        working-directory: mcp-server
        run: |
          echo "✅ README.md exists: $(test -f README.md && echo 'YES' || echo 'NO')"
          echo "✅ INSTALLATION.md exists: $(test -f INSTALLATION.md && echo 'YES' || echo 'NO')"
          echo "✅ SETUP.md exists: $(test -f SETUP.md && echo 'YES' || echo 'NO')"
          echo "✅ PUBLISHING.md exists: $(test -f PUBLISHING.md && echo 'YES' || echo 'NO')"

      - name: Check for broken links (if applicable)
        working-directory: mcp-server
        run: |
          # Optional: Add link checker
          echo "📚 Documentation verified"

name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy backend to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          tar --exclude='.git' --exclude='node_modules' --exclude='data' \
              --exclude='__pycache__' --exclude='.venv' --exclude='venv' \
              --exclude='frontend/dist' --exclude='*.pyc' \
              -czf /tmp/aphelion-deploy.tar.gz .

          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
              /tmp/aphelion-deploy.tar.gz ec2-user@"$EC2_HOST":/opt/aphelion/deploy.tar.gz

          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ec2-user@"$EC2_HOST" '
            set -e
            cd /opt/aphelion
            tar xzf deploy.tar.gz --exclude=".env.production"
            rm deploy.tar.gz
            docker build -t aphelion-backend -f Dockerfile.backend .
            docker rm -f aphelion-backend || true
            docker run -d --name aphelion-backend --env-file /opt/aphelion/.env.production \
              -p 80:5000 -v /opt/aphelion/data:/app/data --restart unless-stopped aphelion-backend
            sleep 5
            curl -f http://localhost/health
          '

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: deploy-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.BACKEND_URL }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
        run: |
          npm install
          npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Sync to S3 and invalidate CloudFront
        run: |
          aws s3 sync frontend/dist s3://aphelion-frontend-888150388431/ --delete
          aws cloudfront create-invalidation --distribution-id EPIPL58OXRBGZ --paths "/*"

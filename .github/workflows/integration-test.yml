name: Integration Tests

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Build frontend
        run: cd frontend && npm run build
        env:
          VITE_API_URL: http://localhost:5000
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_dummy

      - name: Start backend
        run: |
          python -m backend.app &
          sleep 5
        env:
          DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
          API_ACCESS_KEY: test_key
          SECRET_KEY: test_secret
          CLERK_SECRET_KEY: test_clerk_key
          ENCRYPTION_KEY: ucWu8K-SJZDKTDAujfaFxAqvQOl5MEFyDmoc94mHELg=
          FLASK_ENV: testing

      - name: Wait for backend to be ready
        run: |
          for i in {1..30}; do
            curl -f http://localhost:5000/health && echo "Backend is ready" && exit 0
            echo "Waiting for backend... ($i/30)"
            sleep 2
          done
          echo "Backend failed to start"
          exit 1

      - name: Run backend integration tests
        run: |
          pytest tests -v --cov=backend --cov-report=xml
        env:
          DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
          API_ACCESS_KEY: test_key
          SECRET_KEY: test_secret
          FLASK_ENV: testing

      - name: Run frontend E2E tests
        run: cd frontend && npm run test:e2e || true
        env:
          VITE_API_URL: http://localhost:5000

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-compose-test:
    name: Docker Compose Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Start services
        run: |
          docker-compose up -d
          sleep 10

      - name: Health checks
        run: |
          docker-compose ps
          docker exec postpilot-backend curl -f http://localhost:5000/health
          docker exec postpilot-frontend wget --no-verbose --tries=1 --spider http://localhost:5173

      - name: View logs
        if: failure()
        run: docker-compose logs

      - name: Stop services
        run: docker-compose down

name: Keep Backend Alive

on:
  schedule:
    # Every 10 minutes. Render's free tier sleeps after ~15 min idle; the
    # in-process scheduler that fires scheduled LinkedIn posts dies with it.
    # This ping keeps the service warm so scheduled posts actually fire on
    # time instead of silently missing their window while asleep.
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          for i in 1 2 3; do
            status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 \
              https://social-media-manager-api-wk5g.onrender.com/health)
            echo "Attempt $i: HTTP $status"
            if [ "$status" = "200" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "::warning::Backend health check did not return 200 after 3 attempts"
